<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>소환 · 가챠 추첨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#0A0910; --ink2:#12101E; --panel:#191527; --panel-line:#2A2440;
    --text:#EDE9F7; --text-dim:#9E97BC; --accent:#FF3E7F; --accent-dark:#C71E5A;
    --n:#7C8698; --r:#2FD0E8; --sr:#B15CFF; --ssr:#FFC93C; --charge:#8FE9FF;
    --rune:rgba(255,255,255,.14); --rune-front:rgba(255,255,255,.055);
    --ssr-cover-bg:rgba(4,3,10,.94);
    --rune-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%270.9%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2746%27%2F%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2739%27%20stroke-dasharray%3D%272%203%27%2F%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2727%27%2F%3E%3Cpolygon%20points%3D%2750%2C12%2083%2C68%2017%2C68%27%2F%3E%3Cpolygon%20points%3D%2750%2C88%2017%2C32%2083%2C32%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Pretendard',system-ui,sans-serif;
    background:
      radial-gradient(120% 80% at 50% -10%, #241B3E 0%, rgba(36,27,62,0) 55%),
      radial-gradient(90% 60% at 50% 110%, #2A1030 0%, rgba(42,16,48,0) 60%),
      var(--ink);
    color:var(--text); min-height:100dvh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Black Han Sans',sans-serif;font-weight:400;letter-spacing:.5px;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}

  .ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .ambient::before{
    content:"";position:absolute;top:38%;left:50%;width:140vmax;height:140vmax;transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg, transparent 0deg, rgba(177,92,255,.10) 60deg, transparent 120deg, rgba(47,208,232,.08) 200deg, transparent 260deg, rgba(255,62,127,.10) 320deg, transparent 360deg);
    animation:spin 40s linear infinite;opacity:.7;}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}

  .screen{position:relative;z-index:1;flex:1;display:none;flex-direction:column;padding:22px 20px 28px;}
  .screen.on{display:flex;animation:screenIn .35s ease both;}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .brand{text-align:center;margin-bottom:8px;}
  .brand .kicker{font-size:11px;letter-spacing:6px;color:var(--accent);font-weight:800;margin-bottom:8px;text-shadow:0 0 16px rgba(255,62,127,.5);}
  .brand h1{margin:0;font-family:'Pretendard',sans-serif;font-weight:900;font-size:54px;line-height:1.06;letter-spacing:-1.5px;
    background:linear-gradient(176deg,#FFFFFF 10%,#FFE9A6 42%,#FFB13C 66%,#FF7BB0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 #5A2A82) drop-shadow(0 -1px 0 rgba(255,255,255,.35)) drop-shadow(0 6px 14px rgba(120,40,120,.5)) drop-shadow(0 0 30px rgba(255,120,180,.55));}
  .brand .sub{color:var(--text-dim);font-size:12.5px;margin-top:8px;letter-spacing:.3px;}

  .card-panel{background:linear-gradient(180deg,var(--panel) 0%,#141122 100%);border:1px solid var(--panel-line);
    border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 18px 50px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03);}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  label.flabel{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:8px;letter-spacing:.3px;}
  label.flabel .hint{font-weight:500;font-size:11px;color:#6E6690;}
  textarea{width:100%;min-height:170px;resize:vertical;background:#0E0B18;border:1px solid var(--panel-line);
    border-radius:12px;color:var(--text);padding:13px 14px;font-family:'Pretendard';font-size:15px;line-height:1.7;outline:none;transition:border-color .2s;}
  textarea:focus{border-color:var(--accent);}
  textarea::placeholder{color:#514B6E;}

  .count-pill{display:inline-flex;align-items:center;gap:6px;background:#0E0B18;border:1px solid var(--panel-line);
    border-radius:999px;padding:4px 12px;font-size:12px;color:var(--text-dim);font-weight:600;}
  .count-pill b{color:var(--text);font-size:13px;}

  .stepper{display:flex;align-items:center;background:#0E0B18;border:1px solid var(--panel-line);border-radius:12px;overflow:hidden;width:100%;}
  .stepper button{flex:0 0 54px;height:56px;background:transparent;border:none;color:var(--text);font-size:26px;font-weight:700;cursor:pointer;transition:background .15s;}
  .stepper button:active{background:rgba(255,62,127,.18);}
  .stepper input{flex:1;width:100%;min-width:0;height:56px;line-height:56px;padding:0;border:none;background:transparent;color:var(--ssr);text-align:center;font-family:'Black Han Sans';font-size:24px;outline:none;-moz-appearance:textfield;appearance:textfield;}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .odds-note{margin-top:8px;font-size:11.5px;color:#6E6690;text-align:center;}
  .odds-note b{color:var(--ssr);}
  .warn{color:#FF7A9C;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;font-weight:600;}

  .btn{width:100%;border:none;border-radius:14px;padding:17px;font-family:'Pretendard',sans-serif;font-weight:800;font-size:18px;letter-spacing:.5px;
    cursor:pointer;color:#fff;position:relative;overflow:hidden;transition:transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:linear-gradient(135deg,#FF5E93,var(--accent-dark));box-shadow:0 12px 30px -10px rgba(255,62,127,.6);}
  .btn.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite;}
  @keyframes sheen{0%,100%{left:-60%;}55%,80%{left:130%;}}
  .btn.ghost{background:#191527;border:1px solid var(--panel-line);color:var(--text-dim);box-shadow:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.primary:disabled::after{display:none;}
  .setup-cta{margin-top:20px;}

  /* ---------- draw ---------- */
  .draw-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .back-btn{background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;font-weight:600;padding:6px 2px;}
  .progress{text-align:right;}
  .progress .big{font-family:'Black Han Sans';font-size:22px;line-height:1;}
  .progress .big .rem{color:var(--ssr);}
  .progress .lab{font-size:11px;color:var(--text-dim);letter-spacing:.5px;margin-top:2px;}

  .board-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:2px 4px 8px;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .slot{aspect-ratio:5/7;perspective:800px;cursor:pointer;}
  .slot.done{cursor:default;}
  .slot-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,1.3,.5,1);}
  .slot.flipped .slot-inner{transform:rotateY(180deg);}
  .sface{position:absolute;inset:0;backface-visibility:hidden;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
  .sback{background:linear-gradient(160deg,#241C40,#150F26);border:1px solid #352B55;transition:transform .12s, box-shadow .2s;}
  .sback::before{content:"";position:absolute;inset:8px;pointer-events:none;background:var(--rune);-webkit-mask:var(--rune-mask) center/contain no-repeat;mask:var(--rune-mask) center/contain no-repeat;}
  .sback .q{position:relative;z-index:1;font-family:'Black Han Sans';font-size:30px;color:rgba(255,255,255,.18);}
  .slot:not(.done):active .sback{transform:scale(.94);}
  @media(hover:hover){.slot:not(.done):hover .sback{box-shadow:0 0 0 1.5px var(--accent), 0 0 22px -4px var(--accent);}}
  .sfront{transform:rotateY(180deg);border:1.5px solid var(--rc,#7C8698);
    background:radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--rc,#7C8698) 46%, #120E20), #0E0B18 80%);
    box-shadow:0 0 20px -5px var(--rc), inset 0 0 16px -6px var(--rc);}
  .sfront::before{content:"";position:absolute;inset:7px;pointer-events:none;background:var(--rune-front);-webkit-mask:var(--rune-mask) center/contain no-repeat;mask:var(--rune-mask) center/contain no-repeat;z-index:0;}
  .sfront>*{position:relative;z-index:1;}
  .sfront .srank{font-family:'Black Han Sans';font-size:26px;line-height:.9;color:var(--rc);text-shadow:0 0 12px var(--rc);}
  .sfront .sname{font-size:11px;font-weight:800;margin-top:5px;padding:0 4px;text-align:center;word-break:keep-all;line-height:1.2;max-width:100%;}
  .sfront .sstar{position:absolute;top:6px;font-size:8px;letter-spacing:1px;color:var(--rc);opacity:.9;}
  .slot.reveal-pop .slot-inner{animation:pop .4s ease;}
  @keyframes pop{0%{}40%{transform:rotateY(180deg) scale(1.12);}100%{transform:rotateY(180deg) scale(1);}}
  .slot.ssrcard .sfront{animation:ssrGlow 1.5s ease-in-out infinite;}
  @keyframes ssrGlow{0%,100%{box-shadow:0 0 20px -3px var(--ssr), inset 0 0 16px -5px var(--ssr);}50%{box-shadow:0 0 40px 3px var(--ssr), inset 0 0 24px -2px var(--ssr);}}

  .draw-actions{display:flex;gap:10px;margin-top:14px;}
  .draw-actions .btn{margin:0;flex:1;font-size:16px;padding:15px 10px;}

  /* ---------- result ---------- */
  .result-hero{text-align:center;margin-bottom:6px;}
  .result-hero .kicker{color:var(--ssr);font-size:12px;letter-spacing:4px;font-weight:700;}
  .result-hero h2{font-family:'Black Han Sans';font-size:32px;margin:6px 0 2px;letter-spacing:1px;}
  .winners{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .winner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;
    background:radial-gradient(120% 140% at 0% 0%, rgba(255,201,60,.16), rgba(255,201,60,0) 60%), #171226;
    border:1px solid rgba(255,201,60,.4);box-shadow:0 0 30px -12px var(--ssr);}
  .winner .wr{font-family:'Black Han Sans';font-size:26px;color:var(--ssr);text-shadow:0 0 14px var(--ssr);min-width:52px;}
  .winner .wn{font-size:18px;font-weight:800;}
  .winner .wi{margin-left:auto;font-size:11px;color:var(--text-dim);letter-spacing:2px;}
  .no-winner{text-align:center;color:var(--text-dim);padding:24px 0;font-size:14px;}
  .breakdown{margin-top:22px;}
  .breakdown h3{font-size:12px;color:var(--text-dim);letter-spacing:2px;font-weight:700;margin:0 0 12px;text-align:center;}
  .bd-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bd-row .lab{font-family:'Black Han Sans';width:44px;font-size:16px;color:var(--rc);}
  .bd-row .bar{flex:1;height:12px;border-radius:999px;background:#0E0B18;overflow:hidden;border:1px solid var(--panel-line);}
  .bd-row .bar i{display:block;height:100%;background:var(--rc);box-shadow:0 0 12px var(--rc);border-radius:999px;transition:width .8s cubic-bezier(.2,.9,.3,1);}
  .bd-row .cnt{width:34px;text-align:right;font-size:13px;font-weight:700;color:var(--text);}
  .result-actions{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
  .btn.share{background:linear-gradient(135deg,#FFD35A,#FF8A3D);color:#3A2308;box-shadow:0 12px 30px -10px rgba(255,180,60,.6);}
  .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:70;
    background:#241C3C;border:1px solid var(--panel-line);color:var(--text);padding:12px 22px;border-radius:999px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 12px 34px -8px rgba(0,0,0,.75);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  details.roster{margin-top:18px;border-top:1px solid var(--panel-line);padding-top:14px;}
  details.roster summary{cursor:pointer;color:var(--text-dim);font-size:13px;font-weight:600;list-style:none;text-align:center;}
  details.roster summary::-webkit-details-marker{display:none;}
  .roster-list{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--rc);color:var(--rc);background:color-mix(in srgb,var(--rc) 10%, transparent);font-weight:600;}

  /* ---------- fx ---------- */
  .flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;}
  .flash.go{animation:flashGo .5s ease-out;}
  @keyframes flashGo{0%{opacity:0;}18%{opacity:.9;}100%{opacity:0;}}
  #fxCanvas{position:fixed;inset:0;z-index:60;pointer-events:none;}
  .rays{position:fixed;top:50%;left:50%;width:0;height:0;z-index:45;pointer-events:none;opacity:0;}
  .rays.go{animation:raysGo 1.1s ease-out;}
  @keyframes raysGo{0%{opacity:0;}20%{opacity:.8;}100%{opacity:0;}}
  .rays::before{content:"";position:absolute;top:-70vmax;left:-70vmax;width:140vmax;height:140vmax;
    background:conic-gradient(from 0deg, transparent 0 8deg, rgba(255,201,60,.5) 8deg 10deg, transparent 10deg 22deg,
      rgba(255,201,60,.35) 22deg 24deg, transparent 24deg 40deg, rgba(255,201,60,.5) 40deg 42deg, transparent 42deg 60deg);animation:spin 6s linear infinite;}
  .banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);z-index:55;pointer-events:none;
    font-family:'Black Han Sans';font-size:15vw;letter-spacing:4px;opacity:0;
    background:linear-gradient(180deg,#FFF7DA,#FFC93C 60%,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(255,201,60,.6);}
  .banner.go{animation:bannerGo 1.3s cubic-bezier(.2,1.4,.4,1);}
  @keyframes bannerGo{0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}75%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
  .shake{animation:shake .5s ease;}
  @keyframes shake{0%,100%{transform:none;}20%{transform:translate(-5px,3px);}40%{transform:translate(4px,-4px);}60%{transform:translate(-4px,-3px);}80%{transform:translate(4px,3px);}}

  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;}.ambient,.btn.primary::after{display:none;}}
  @media (max-width:400px){.board{grid-template-columns:repeat(3,1fr);} .brand h1{font-size:32px;}}
  /* ---------- cutscenes ---------- */
  .cutscene{position:fixed;inset:0;z-index:65;pointer-events:none;display:none;}
  .cutscene.on{display:block;}
  .cs-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%, rgba(20,14,38,0), rgba(6,4,12,.82));opacity:0;animation:csbg 1.15s ease;}
  @keyframes csbg{0%{opacity:0;}22%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
  .summon{position:absolute;top:50%;left:50%;width:min(82vw,360px);height:min(82vw,360px);transform:translate(-50%,-50%);opacity:0;
    filter:drop-shadow(0 0 16px rgba(255,201,60,.75));animation:summonIn 1.2s cubic-bezier(.35,1.1,.4,1) forwards;}
  @keyframes summonIn{
    0%{transform:translate(-50%,-50%) scale(.15) rotate(-45deg);opacity:0;filter:drop-shadow(0 0 6px rgba(255,201,60,.4));}
    22%{opacity:1;}
    68%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1;filter:drop-shadow(0 0 22px rgba(255,201,60,.85));}
    82%{opacity:1;filter:drop-shadow(0 0 46px #FFE9A8) brightness(1.7);}
    100%{transform:translate(-50%,-50%) scale(1.18) rotate(0deg);opacity:0;filter:drop-shadow(0 0 60px #FFE9A8) brightness(2);}}
  .summon svg{width:100%;height:100%;display:block;}
  .summon .ring-a{transform-box:fill-box;transform-origin:center;animation:spinCW 3.2s linear infinite;}
  .summon .ring-b{transform-box:fill-box;transform-origin:center;animation:spinCCW 4.4s linear infinite;}
  @keyframes spinCW{to{transform:rotate(360deg);}}
  @keyframes spinCCW{to{transform:rotate(-360deg);}}
  .pillar{position:fixed;inset:0;z-index:64;pointer-events:none;display:none;overflow:hidden;}
  .pillar.on{display:block;}
  .pdim{position:absolute;inset:0;background:rgba(6,4,12,.6);opacity:0;animation:pdim 1.08s ease;}
  @keyframes pdim{0%{opacity:0;}18%{opacity:1;}82%{opacity:1;}100%{opacity:0;}}
  .beam{position:absolute;top:0;bottom:0;left:50%;width:0;transform:translateX(-50%);filter:blur(2px);
    background:linear-gradient(90deg, rgba(255,201,60,0), rgba(255,235,150,.9) 45%, #FFFFFF 50%, rgba(255,235,150,.9) 55%, rgba(255,201,60,0));
    animation:beam 1.08s cubic-bezier(.6,0,.3,1);}
  @keyframes beam{0%{width:0;opacity:0;}22%{width:16px;opacity:1;}52%{width:70px;opacity:1;}74%{width:150px;opacity:1;}100%{width:100vw;opacity:0;}}
  .ssr-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;opacity:0;background:var(--ssr-cover-bg);}
  .ssr-cover.show{animation:ssrCover 1.05s ease forwards;}
  @keyframes ssrCover{0%{opacity:0;}16%{opacity:1;}78%{opacity:1;}100%{opacity:0;}}
  .ssr-cover .cr{font-family:'Black Han Sans',sans-serif;font-size:24vw;line-height:1;letter-spacing:4px;transform:scale(.5);opacity:0;
    background:linear-gradient(180deg,#FFF7DA,#FFC93C 60%,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 34px rgba(255,201,60,.75));}
  .ssr-cover.show .cr{animation:crPop .95s cubic-bezier(.2,1.5,.4,1) forwards;}
  @keyframes crPop{0%{transform:scale(.5);opacity:0;}32%{transform:scale(1.07);opacity:1;}100%{transform:scale(1);opacity:1;}}
  .ssr-cover .cn{font-size:8vw;font-weight:900;color:#FFE9A8;text-shadow:0 0 22px rgba(255,201,60,.6);opacity:0;word-break:keep-all;text-align:center;padding:0 6vw;}
  .ssr-cover.show .cn{animation:cnPop .9s ease .14s forwards;}
  @keyframes cnPop{0%{opacity:0;transform:translateY(14px);}45%{opacity:1;transform:none;}100%{opacity:1;}}
  /* SR fake-out: opens gold like SSR, then sags into purple SR */
  .ssr-cover.srfake.show{animation:srfIn .6s ease forwards;}
  @keyframes srfIn{0%{opacity:0;}55%{opacity:1;}100%{opacity:1;}}
  .ssr-cover.srfake.fizzle{animation:srfOut 1.05s ease forwards;}
  @keyframes srfOut{0%{opacity:1;}72%{opacity:1;}100%{opacity:0;}}
  .ssr-cover.srfake.fizzle .cr{
    background:linear-gradient(180deg,#E6D8FF,#B15CFF 60%,#7A3FD0);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(177,92,255,.7));animation:srSag .95s cubic-bezier(.3,.7,.3,1) forwards;}
  @keyframes srSag{0%{transform:scale(1.12);opacity:1;}28%{transform:scale(.78) translateY(16px) rotate(-4deg);opacity:.85;}
    55%{transform:scale(.9) translateY(2px) rotate(1deg);opacity:1;}100%{transform:scale(.88);opacity:1;}}

  /* ---------- light mode ---------- */
  @media (prefers-color-scheme: light){
    :root{--ink:#EEF2FB;--ink2:#FFFFFF;--panel:#FFFFFF;--panel-line:#DCE4F2;--text:#1B2438;--text-dim:#66708F;
      --accent:#2F6BFF;--accent-dark:#1E4FCC;--rune:rgba(30,74,160,.18);--rune-front:rgba(30,74,160,.10);--ssr-cover-bg:rgba(255,255,255,.95);}
    body{background:
      radial-gradient(120% 80% at 50% -10%, #DCE7FF 0%, rgba(220,231,255,0) 55%),
      radial-gradient(90% 60% at 50% 110%, #DCF2FF 0%, rgba(220,242,255,0) 60%),
      var(--ink);}
    .card-panel{background:linear-gradient(180deg,#FFFFFF,#F6F9FF);box-shadow:0 18px 44px -26px rgba(40,80,160,.30), inset 0 1px 0 rgba(255,255,255,.7);}
    textarea{background:#F3F6FD;color:var(--text);}
    textarea::placeholder{color:#A8B4CE;}
    .count-pill{background:#EEF3FC;}
    .stepper{background:#F3F6FD;}
    .stepper button{color:#37456B;}
    .stepper input{color:#C7891A;}
    .sback{background:linear-gradient(160deg,#E3ECFB,#D6E1F3);border-color:#C9D6EE;}
    .sback .q{color:rgba(40,74,150,.30);}
    .sfront{background:radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--rc) 32%, #FFFFFF), #EEF2FB 82%);
      box-shadow:0 0 18px -6px var(--rc), inset 0 0 16px -8px var(--rc);}
    .bd-row .bar{background:#EBF0FA;border-color:#DCE4F2;}
    .toast{background:#FFFFFF;color:var(--text);border-color:#DCE4F2;}
    .btn.primary{background:linear-gradient(135deg,#4C8DFF,#1E4FCC);box-shadow:0 12px 30px -10px rgba(47,107,255,.5);}
    .btn.ghost{background:#EEF3FC;border-color:#DCE4F2;color:#66708F;}
    .back-btn{color:#66708F;}
    .brand .kicker{text-shadow:0 0 16px rgba(47,107,255,.5);}
    .brand h1{background:linear-gradient(176deg,#2F8FFF 0%,#3F6BFF 46%,#6B5BFF 100%);-webkit-background-clip:text;background-clip:text;
      filter:drop-shadow(0 2px 0 rgba(255,255,255,.7)) drop-shadow(0 6px 14px rgba(60,90,200,.28)) drop-shadow(0 0 20px rgba(80,140,255,.35));}
    .winner{background:radial-gradient(120% 140% at 0% 0%, rgba(255,190,60,.28), rgba(255,190,60,0) 60%), #FFF8E6;border-color:rgba(226,168,40,.55);}
    .pdim{background:rgba(255,255,255,.55);}
    .ssr-cover .cr{background:linear-gradient(180deg,#FFB43C,#FF8A3D 55%,#E0631A);-webkit-background-clip:text;background-clip:text;}
    .ssr-cover .cn{color:#9A6410;text-shadow:0 0 18px rgba(255,180,60,.5);}
    .mute{background:rgba(255,255,255,.82);border-color:#DCE4F2;color:#37456B;}
    .winner .wn{-webkit-text-fill-color:#8A5A10;color:#8A5A10;background:none;animation:none;}
    .winner::before{background:rgba(210,150,30,.16);}
  }
  /* ---------- charge aura + sound button + winner shimmer ---------- */
  .charge-aura{position:absolute;inset:-5px;border-radius:15px;pointer-events:none;z-index:6;--ca:#EAF7FF;
    box-shadow:0 0 0 2px var(--ca), 0 0 22px 4px var(--ca);animation:caPulse .26s ease-in-out infinite alternate;}
  @keyframes caPulse{from{opacity:.5;transform:scale(.98);}to{opacity:1;transform:scale(1.03);}}
  .slot.charging{animation:cardVib .09s linear infinite;z-index:3;}
  @keyframes cardVib{0%,100%{transform:translate(0,0);}25%{transform:translate(-1px,1px);}75%{transform:translate(1px,-1px);}}
  .mute{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:72;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--panel-line);background:rgba(25,21,39,.7);color:var(--text);font-size:17px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .2s,background .2s,box-shadow .2s,transform .12s;}
  .mute:active{transform:scale(.9);}
  .mute.on{border-color:var(--accent);background:rgba(255,62,127,.16);animation:sndPulse 2.4s ease-in-out infinite;}
  @keyframes sndPulse{0%,100%{box-shadow:0 0 12px -5px var(--accent);}50%{box-shadow:0 0 20px -1px var(--accent);}}
  .winner{position:relative;overflow:hidden;}
  .winner::before{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(255,201,60,.14);
    -webkit-mask:var(--rune-mask) right center/auto 160% no-repeat;mask:var(--rune-mask) right center/auto 160% no-repeat;opacity:.6;}
  .winner>*{position:relative;z-index:1;}
  .winner .wn{background:linear-gradient(90deg,#fff 0%,#FFE9A8 50%,#fff 100%);background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:wnShine 2.6s linear infinite;}
  @keyframes wnShine{to{background-position:-200% 0;}}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="app">

  <!-- SETUP -->
  <section class="screen on" id="setup">
    <div class="brand">
      <div class="kicker">GACHA DRAW</div>
      <h1 class="display">당첨 가챠</h1>
      <div class="sub">카드를 뒤집어 SSR을 찾아라 · SSR = 당첨</div>
    </div>
    <div class="card-panel">
      <div class="field">
        <label class="flabel" for="names">참가자 <span class="hint">띄어쓰기 · 쉼표 · 줄바꿈으로 구분</span></label>
        <textarea id="names" placeholder="김민준, 신지환, 김동찬&#10;또는  김민준 신지환 김동찬"></textarea>
        <div style="margin-top:10px;"><span class="count-pill">참가 인원 <b id="pcount">0</b> 명</span></div>
      </div>
      <div class="field">
        <label class="flabel">SSR 당첨 인원</label>
        <div class="stepper">
          <button type="button" id="minus">−</button>
          <input id="ssr" type="number" value="1" min="1" inputmode="numeric">
          <button type="button" id="plus">+</button>
        </div>
        <div class="odds-note">참가자 중 <b id="oddsNum">1</b>명이 <b>SSR</b>로 당첨됩니다</div>
      </div>
      <div class="warn" id="warn"></div>
    </div>
    <button class="btn primary setup-cta" id="startBtn">가챠 뽑기</button>
  </section>

  <!-- DRAW -->
  <section class="screen" id="draw">
    <div class="draw-top">
      <button class="back-btn" id="backBtn">← 다시 설정</button>
      <div class="progress">
        <div class="big"><span class="rem" id="remain">0</span> 장 남음</div>
        <div class="lab">카드를 눌러 뒤집기</div>
      </div>
    </div>
    <div class="board-scroll"><div class="board" id="board"></div></div>
    <div class="draw-actions">
      <button class="btn primary" id="revealAll">전부 공개</button>
      <button class="btn ghost" id="toResult" style="display:none">결과 보기</button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="result">
    <div class="result-hero">
      <div class="kicker">RESULT</div>
      <h2 class="display" id="resultTitle">당첨 결과</h2>
    </div>
    <div class="winners" id="winners"></div>
    <div class="breakdown">
      <h3>등급 분포</h3>
      <div id="bdRows"></div>
    </div>
    <details class="roster">
      <summary>전체 명단 펼쳐보기</summary>
      <div class="roster-list" id="rosterList"></div>
    </details>
    <div class="result-actions">
      <button class="btn share" id="shareBtn">결과 공유</button>
      <button class="btn primary" id="againBtn">같은 명단으로 다시</button>
      <button class="btn ghost" id="newBtn">처음부터</button>
    </div>
  </section>
</div>

<div class="flash" id="flash"></div>
<div class="rays" id="rays"></div>
<div class="banner display" id="banner">SSR</div>
<canvas id="fxCanvas"></canvas>
<div class="cutscene" id="cutscene"></div>
<div class="pillar" id="pillar"></div>
<div class="toast" id="toast"></div>
<button class="mute on" id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const RARITY = {
    N:  {color:'#7C8698', stars:'★',     tag:'Normal'},
    R:  {color:'#2FD0E8', stars:'★★',    tag:'Rare'},
    SR: {color:'#B15CFF', stars:'★★★',   tag:'Super Rare'},
    SSR:{color:'#FFC93C', stars:'★★★★★', tag:'당첨'}
  };
  const ORDER = ['SSR','SR','R','N'];

  let state = { people:[], pool:[], slots:0, revealed:0, ssrCount:1, busy:false };

  // ---- setup ----
  const namesEl=$('#names'), ssrEl=$('#ssr'), pcountEl=$('#pcount'), oddsNumEl=$('#oddsNum'), warnEl=$('#warn');
  const parseNames=()=>namesEl.value.split(/[\s,]+/).map(s=>s.trim()).filter(Boolean);
  function refreshSetup(){
    const n=parseNames().length; pcountEl.textContent=n;
    let v=parseInt(ssrEl.value)||1; if(v<1)v=1; if(n>0&&v>n)v=n; ssrEl.value=v; oddsNumEl.textContent=v;
    if(n===0) warnEl.textContent='';
    else if(v>=n) warnEl.textContent='당첨 인원이 참가 인원 이상이에요 — 전부 당첨돼요.';
    else warnEl.textContent='';
  }
  namesEl.addEventListener('input',refreshSetup);
  ssrEl.addEventListener('input',refreshSetup);
  $('#minus').addEventListener('click',()=>{ssrEl.value=Math.max(1,(parseInt(ssrEl.value)||1)-1);refreshSetup();});
  $('#plus').addEventListener('click',()=>{ssrEl.value=(parseInt(ssrEl.value)||1)+1;refreshSetup();});

  $('#startBtn').addEventListener('click',()=>{
    const names=parseNames();
    if(names.length<1){warnEl.textContent='참가자를 한 명 이상 넣어주세요.';namesEl.focus();return;}
    const ssr=Math.min(parseInt(ssrEl.value)||1,names.length);
    resumeAudio(); buildPool(names,ssr); startCutscene(()=>goDraw());
  });

  function buildPool(names,ssrCount){
    const idx=names.map((_,i)=>i); shuffle(idx);
    const ssrIdx=idx.slice(0,ssrCount);
    const loserIdx=idx.slice(ssrCount);
    // weighted N/R/SR among non-SSR people: more N, fewer SR
    const L=loserIdx.length;
    const nN=Math.round(L*0.46), nSR=Math.round(L*0.20), nR=Math.max(0,L-nN-nSR);
    const loserGrades=[];
    for(let i=0;i<nN;i++) loserGrades.push('N');
    for(let i=0;i<nR;i++) loserGrades.push('R');
    for(let i=0;i<nSR;i++) loserGrades.push('SR');
    while(loserGrades.length<L) loserGrades.push('N');
    shuffle(loserGrades);
    const gradeOf={};
    ssrIdx.forEach(i=>gradeOf[i]='SSR');
    loserIdx.forEach((i,k)=>gradeOf[i]=loserGrades[k]);
    const people=names.map((name,i)=>({name,grade:gradeOf[i]}));
    const pool=people.slice(); shuffle(pool);      // draw order (pool.pop() reveals from the end)
    // hold one SSR back so it can't come out early — reveal it in the last ~30%
    const ssrAt=pool.map((p,i)=>p.grade==='SSR'?i:-1).filter(i=>i>=0);
    if(ssrAt.length && pool.length>3){
      const [held]=pool.splice(ssrAt[ssrAt.length-1],1);   // pull one SSR out
      const lateZone=Math.max(1,Math.floor(pool.length*0.30)); // front of array = popped last = late
      pool.splice(Math.floor(Math.random()*lateZone),0,held);
    }
    state={people,pool,slots:people.length,revealed:0,ssrCount,busy:false,ssrShown:0};
  }
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

  // ---- screen switching ----
  function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('#'+id).classList.add('on');window.scrollTo(0,0);}
  $('#backBtn').addEventListener('click',()=>{if(!state.busy)show('setup');});

  // ---- draw ----
  const board=$('#board'), remainEl=$('#remain'), revealAllBtn=$('#revealAll'), toResultBtn=$('#toResult');
  function goDraw(){
    if(location.hash) history.replaceState(null,'',location.pathname+location.search);
    board.innerHTML='';
    for(let i=0;i<state.slots;i++){
      const slot=document.createElement('div');
      slot.className='slot';
      slot.innerHTML=`<div class="slot-inner">
        <div class="sface sback"><div class="q">?</div></div>
        <div class="sface sfront"></div>
      </div>`;
      slot.addEventListener('click',()=>onSlotClick(slot));
      board.appendChild(slot);
    }
    remainEl.textContent=state.slots;
    revealAllBtn.style.display=''; revealAllBtn.disabled=false;
    toResultBtn.style.display='none';
    show('draw');
  }

  function onSlotClick(slot){
    if(state.busy || slot.classList.contains('done') || state.pool.length===0) return;
    const person=state.pool.pop();
    state.busy=true;
    if(person.grade==='SSR'){
      const big=(state.ssrShown===0)||(state.ssrCount<=3);
      state.ssrShown=(state.ssrShown||0)+1;
      if(big){
        ssrPillar(person,()=>{
          flipSlot(slot,person,true);
          state.revealed++; remainEl.textContent=state.slots-state.revealed;
          celebrate();
          state.busy=false; checkDone();
        });
      } else {
        chargeAndReveal(slot,person,()=>{
          flipSlot(slot,person,true);
          state.revealed++; remainEl.textContent=state.slots-state.revealed;
          burst(RARITY.SSR.color,40,true); quickFlash(RARITY.SSR.color); sfx('ssr');
          state.busy=false; checkDone();
        });
      }
    } else if(person.grade==='SR'){
      // fake-out: opens exactly like an SSR summon, then deflates to SR
      srFakeout(person,()=>{
        flipSlot(slot,person,true);
        state.revealed++; remainEl.textContent=state.slots-state.revealed;
        burst(RARITY.SR.color,28); sfx('reveal_SR');
        state.busy=false; checkDone();
      });
    } else {
      chargeAndReveal(slot,person,()=>{
        flipSlot(slot,person,true);
        state.revealed++; remainEl.textContent=state.slots-state.revealed;
        sfx('reveal_'+person.grade);
        state.busy=false; checkDone();
      });
    }
  }

  function flipSlot(slot,person,pop){
    const rar=RARITY[person.grade];
    slot.classList.add('done');
    slot.style.setProperty('--rc',rar.color);
    const front=slot.querySelector('.sfront');
    front.innerHTML=`<div class="sstar">${rar.stars}</div><div class="srank">${person.grade}</div><div class="sname">${esc(person.name)}</div>`;
    const nm=front.querySelector('.sname'); if(nm){ const L=person.name.length; nm.style.fontSize=(L<=3?12:L<=5?10.5:L<=7?9:7.5)+'px'; }
    slot.classList.add('flipped');
    if(pop){slot.classList.add('reveal-pop');setTimeout(()=>slot.classList.remove('reveal-pop'),400);}
    if(person.grade==='SSR') slot.classList.add('ssrcard');
  }

  function checkDone(){
    if(state.pool.length===0){
      revealAllBtn.style.display='none';
      toResultBtn.style.display='';
    }
  }

  // reveal all — wave; the last SSR gets the full-screen finale
  revealAllBtn.addEventListener('click',()=>{
    if(state.busy || state.pool.length===0) return;
    state.busy=true; revealAllBtn.disabled=true;
    const slots=[...board.querySelectorAll('.slot:not(.done)')];
    const arr=[]; while(state.pool.length) arr.push(state.pool.pop());
    const ssrs=arr.filter(p=>p.grade==='SSR');
    const rest=arr.filter(p=>p.grade!=='SSR'); shuffle(rest);
    let ordered, finale=null;
    if(ssrs.length){ finale=ssrs[0]; ordered=rest.concat(ssrs.slice(1)); }
    else ordered=rest;
    function finalize(){ revealAllBtn.style.display='none'; revealAllBtn.disabled=false; toResultBtn.style.display=''; state.busy=false; }
    let si=0, delay=0;
    ordered.forEach((person)=>{
      const slot=slots[si++], d=delay;
      setTimeout(()=>{
        flipSlot(slot,person,false);
        state.revealed++; remainEl.textContent=state.slots-state.revealed;
        if(person.grade==='SSR'){ burst(RARITY.SSR.color,34,true); quickFlash(RARITY.SSR.color); sfx('ssr'); }
      }, d);
      delay+=80;
    });
    if(finale){
      const slot=slots[si++], d=delay;
      setTimeout(()=>{
        ssrPillar(finale,()=>{
          flipSlot(slot,finale,false);
          state.revealed++; remainEl.textContent=state.slots-state.revealed;
          celebrate(); finalize();
        });
      }, d);
    } else { setTimeout(finalize, delay+250); }
  });

  toResultBtn.addEventListener('click',showResult);

  // ---- result ----
  function showResult(){
    const winners=state.people.filter(p=>p.grade==='SSR');
    const wEl=$('#winners');
    if(winners.length){
      $('#resultTitle').textContent='당첨 '+winners.length+'명';
      wEl.innerHTML=winners.map((w,i)=>`<div class="winner"><div class="wr">SSR</div><div class="wn">${esc(w.name)}</div><div class="wi">WINNER ${String(i+1).padStart(2,'0')}</div></div>`).join('');
    }else{
      $('#resultTitle').textContent='당첨자 없음';
      wEl.innerHTML='<div class="no-winner">SSR 당첨자가 없습니다.</div>';
    }
    const counts={SSR:0,SR:0,R:0,N:0}; state.people.forEach(p=>counts[p.grade]++);
    const total=state.people.length;
    $('#bdRows').innerHTML=ORDER.map(g=>`<div class="bd-row" style="--rc:${RARITY[g].color}"><div class="lab">${g}</div><div class="bar"><i style="width:0%"></i></div><div class="cnt">${counts[g]}</div></div>`).join('');
    requestAnimationFrame(()=>{$('#bdRows').querySelectorAll('.bd-row').forEach((row,i)=>{const g=ORDER[i];row.querySelector('i').style.width=(total?counts[g]/total*100:0)+'%';});});
    $('#rosterList').innerHTML=state.people.slice().sort((a,b)=>ORDER.indexOf(a.grade)-ORDER.indexOf(b.grade))
      .map(p=>`<span class="chip" style="--rc:${RARITY[p.grade].color}">${esc(p.name)} · ${p.grade}</span>`).join('');
    show('result');
    if(winners.length) setTimeout(()=>burst(RARITY.SSR.color,70,true),250);
  }
  // ---- share ----
  function buildShareText(){
    const winners=state.people.filter(p=>p.grade==='SSR');
    const counts={SSR:0,SR:0,R:0,N:0}; state.people.forEach(p=>counts[p.grade]++);
    let t='\uD83C\uDF89 \uB2F9\uCCA8 \uAC00\uCC60 \uACB0\uACFC\n\n';
    t += winners.length ? ('\uD83C\uDFC6 \uB2F9\uCCA8(SSR): '+winners.map(w=>w.name).join(', ')+'\n') : '\uD83C\uDFC6 \uB2F9\uCCA8\uC790 \uC5C6\uC74C\n';
    t += '\n\uB4F1\uAE09 \uBD84\uD3EC  SSR '+counts.SSR+' \u00B7 SR '+counts.SR+' \u00B7 R '+counts.R+' \u00B7 N '+counts.N;
    return t;
  }
  let toastTimer=null;
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900);}
  async function shareResult(){
    const url=resultURL();
    const text=buildShareText();
    if(navigator.share){
      try{ await navigator.share({title:'당첨 가챠 결과', text, url}); return; }
      catch(e){ if(e && e.name==='AbortError') return; }
    }
    try{ await navigator.clipboard.writeText(url); toast('결과 링크를 복사했어요'); return; }catch(e){}
    const ta=document.createElement('textarea'); ta.value=url; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); toast('결과 링크를 복사했어요'); }catch(e){ toast('복사에 실패했어요'); }
    ta.remove();
  }
  $('#shareBtn').addEventListener('click',shareResult);
  $('#againBtn').addEventListener('click',()=>{buildPool(state.people.map(p=>p.name),state.ssrCount);goDraw();});
  $('#newBtn').addEventListener('click',()=>{if(location.hash)history.replaceState(null,'',location.pathname+location.search);show('setup');refreshSetup();});

  const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---- fx ----
  const flashEl=$('#flash'), raysEl=$('#rays'), bannerEl=$('#banner');
  function quickFlash(color){flashEl.style.background=`radial-gradient(circle at 50% 45%, ${color}, transparent 60%)`;flashEl.classList.remove('go');void flashEl.offsetWidth;flashEl.classList.add('go');}
  function celebrate(){
    raysEl.classList.remove('go');void raysEl.offsetWidth;raysEl.classList.add('go');
    bannerEl.classList.remove('go');void bannerEl.offsetWidth;bannerEl.classList.add('go');
    $('.app').classList.remove('shake');void $('.app').offsetWidth;$('.app').classList.add('shake');
    quickFlash(RARITY.SSR.color); burst(RARITY.SSR.color,90,true);
    if(navigator.vibrate) navigator.vibrate([40,30,90]);
  }
  const canvas=$('#fxCanvas'), ctx=canvas.getContext('2d');
  let parts=[], raf=null;
  function sizeCanvas(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  sizeCanvas(); addEventListener('resize',sizeCanvas);
  const palette=['#FFC93C','#FFE9A8','#FF3E7F','#2FD0E8','#B15CFF','#FFFFFF'];
  function burst(color,count,rainbow){
    const cx=innerWidth/2, cy=innerHeight*0.4;
    for(let i=0;i<count;i++){
      const ang=Math.random()*Math.PI*2, sp=4+Math.random()*11;
      parts.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-4,g:0.28+Math.random()*0.12,life:1,decay:0.008+Math.random()*0.012,size:4+Math.random()*6,rot:Math.random()*6.28,vr:(Math.random()-.5)*0.4,color:rainbow?palette[(Math.random()*palette.length)|0]:color});
    }
    if(!raf) raf=requestAnimationFrame(loop);
  }
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts=parts.filter(p=>p.life>0);
    for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.rot+=p.vr;p.life-=p.decay;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);ctx.restore();}
    if(parts.length) raf=requestAnimationFrame(loop); else {raf=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
  }

  // ---- shareable result link ----
  function encodeResult(){
    const payload=state.people.map(p=>[p.name, ORDER.indexOf(p.grade)]);
    const json=JSON.stringify(payload);
    return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function decodeResult(str){
    try{
      str=str.replace(/-/g,'+').replace(/_/g,'/');
      const json=decodeURIComponent(escape(atob(str)));
      const arr=JSON.parse(json);
      if(!Array.isArray(arr)) return null;
      return arr.map(x=>({name:String(x[0]), grade:ORDER[x[1]]||'N'}));
    }catch(e){ return null; }
  }
  function resultURL(){ return location.origin+location.pathname+'#r='+encodeResult(); }
  function loadFromHash(){
    const m=(location.hash||'').match(/^#r=(.+)$/);
    if(!m) return false;
    const people=decodeResult(m[1]);
    if(!people||!people.length) return false;
    const ssrCount=people.filter(p=>p.grade==='SSR').length;
    state={people,pool:[],slots:people.length,revealed:people.length,ssrCount,busy:false,shared:true};
    showResult();
    return true;
  }

  // ---- cutscenes ----
  const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  function playSummon(container){
    container.innerHTML='';
    const bg=document.createElement('div'); bg.className='cs-bg'; container.appendChild(bg);
    const wrap=document.createElement('div'); wrap.className='summon';
    wrap.innerHTML='<svg viewBox="0 0 200 200" width="100%" height="100%" fill="none" stroke="#FFD98A" stroke-width="1.5" stroke-linejoin="round">'
      +'<g class="ring-a"><circle cx="100" cy="100" r="94" stroke-opacity=".9" stroke-dasharray="2 6"/><circle cx="100" cy="100" r="84"/></g>'
      +'<g class="ring-b"><circle cx="100" cy="100" r="70" stroke-dasharray="10 4" stroke-opacity=".8"/><polygon points="100,38 154,132 46,132" stroke-opacity=".9"/><polygon points="100,162 46,68 154,68" stroke-opacity=".9"/></g>'
      +'<g class="ring-a"><circle cx="100" cy="100" r="54" stroke-dasharray="1 5" stroke-opacity=".7"/></g>'
      +'<circle cx="100" cy="100" r="30" stroke-opacity=".6"/></svg>';
    container.appendChild(wrap);
  }
  function startCutscene(cb){
    sfx('summon');
    if(reduce()){ cb&&cb(); return; }
    const cs=$('#cutscene'); cs.classList.add('on'); playSummon(cs);
    if(navigator.vibrate) navigator.vibrate([20,30,50]);
    setTimeout(()=>{ quickFlash('#FFE9A8'); },820);
    setTimeout(()=>{ cs.classList.remove('on'); cs.innerHTML=''; cb&&cb(); },1200);
  }
  function ssrPillar(person,cb){
    if(reduce()){ sfx('ssr'); cb&&cb(); return; }
    sfx('ssr_rise');
    const p=$('#pillar'); p.classList.add('on');
    p.innerHTML='<div class="pdim"></div><div class="beam"></div>'+
      '<div class="ssr-cover" id="ssrCover"><div class="cr">SSR</div><div class="cn">'+esc(person.name)+'</div></div>';
    if(navigator.vibrate) navigator.vibrate([20,40,30]);
    setTimeout(()=>{ quickFlash(RARITY.SSR.color); },520);
    const cover=p.querySelector('#ssrCover');
    const cn=cover.querySelector('.cn'); if(cn){ const L=person.name.length; cn.style.fontSize=(L<=4?8:L<=6?6.5:L<=9?5:4)+'vw'; }
    setTimeout(()=>{ cover.classList.add('show'); sfx('ssr'); if(navigator.vibrate) navigator.vibrate(45); },540);
    setTimeout(()=>{ p.classList.remove('on'); p.innerHTML=''; cb&&cb(); },1650);
  }
  // SR fake-out: identical SSR build-up, then it fizzles down to SR
  function srFakeout(person,cb){
    if(reduce()){ sfx('reveal_SR'); cb&&cb(); return; }
    sfx('ssr_rise');                                  // same tension cue as SSR
    const p=$('#pillar'); p.classList.add('on');
    p.innerHTML='<div class="pdim"></div><div class="beam"></div>'+
      '<div class="ssr-cover srfake" id="ssrCover"><div class="cr">SSR</div></div>';
    if(navigator.vibrate) navigator.vibrate([20,40,30]);
    const cover=p.querySelector('#ssrCover'), cr=cover.querySelector('.cr');
    setTimeout(()=>{ quickFlash(RARITY.SSR.color); },520);   // gold flash — still looks like a win
    setTimeout(()=>{ cover.classList.add('show'); if(navigator.vibrate) navigator.vibrate(40); },540);
    setTimeout(()=>{                                          // the let-down
      sfx('deflate'); cover.classList.add('fizzle'); cr.textContent='SR';
      quickFlash(RARITY.SR.color); if(navigator.vibrate) navigator.vibrate([60,40,20]);
    },1080);
    setTimeout(()=>{ p.classList.remove('on'); p.innerHTML=''; cb&&cb(); },2150);
  }

  // ---- sound (Web Audio, no files) \u2014 grand reverb bus ----
  let actx=null, muted=false, master=null, revConv=null;
  function ac(){
    if(!actx){
      try{
        const AC=window.AudioContext||window.webkitAudioContext;
        actx=new AC();
        master=actx.createGain(); master.gain.value=0.9; master.connect(actx.destination);
        revConv=actx.createConvolver(); revConv.buffer=makeImpulse(3.6,2.6);   // longer cavernous tail
        const rg=actx.createGain(); rg.gain.value=0.98; revConv.connect(rg); rg.connect(master);
      }catch(e){ actx=null; }
    }
    return actx;
  }
  function makeImpulse(sec,decay){
    const c=actx, n=Math.floor(c.sampleRate*sec), b=c.createBuffer(2,n,c.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay); }
    return b;
  }
  function resumeAudio(){ const c=ac(); if(c && c.state==='suspended' && c.resume) c.resume(); }
  // a single oscillator voice with ADSR-ish gain, optional pitch glide / lowpass / reverb send
  function voice(o){
    const c=ac(); if(!c||muted) return;
    const t=o.t||c.currentTime, dur=o.dur||0.4, a=o.a==null?0.01:o.a, pk=o.g||0.2;
    const osc=c.createOscillator(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f,t);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
    let node=osc;
    if(o.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; osc.connect(f); node=f; }
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(pk,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    node.connect(g); g.connect(master);
    if(o.rev){ const s=c.createGain(); s.gain.value=o.rev; g.connect(s); s.connect(revConv); }
    osc.start(t); osc.stop(t+dur+0.06);
  }
  function noise(o){
    const c=ac(); if(!c||muted) return;
    const t=o.t||c.currentTime, dur=o.dur||0.3;
    const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const src=c.createBufferSource(); src.buffer=b;
    const f=c.createBiquadFilter(); f.type=o.ft||'lowpass'; f.frequency.value=o.ff||900; if(o.q)f.Q.value=o.q;
    const g=c.createGain(); g.gain.setValueAtTime(o.g||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(master);
    if(o.rev){ const s=c.createGain(); s.gain.value=o.rev; g.connect(s); s.connect(revConv); }
    src.start(t); src.stop(t+dur+0.02);
  }
  // rising "\uB465\u2026\uB465\u2026\uB465\u2191" charge hit: pitch climbs with the step index
  function chargeHit(i,total,deep){
    const c=ac(); if(!c||muted) return;
    const base=deep?60:150, f=base*Math.pow(deep?1.18:1.12,i);
    voice({type:'sine',f:f*2,f2:f*0.85,dur:deep?0.5:0.24,a:0.004,g:deep?0.5:0.24,rev:deep?0.6:0.2,lp:deep?600:1600});
    noise({dur:0.05,ft:'highpass',ff:2600,g:deep?0.09:0.05,rev:0.15});
    if(deep){ const prog=(i+1)/total; voice({type:'triangle',f:f*4,dur:0.35,a:0.01,g:0.03+prog*0.06,rev:0.6}); }
  }
  function sfx(kind){
    const c=ac(); if(!c||muted) return; const t=c.currentTime;
    if(kind==='summon'){                                    // grand magic-circle boom
      voice({type:'sine',f:30,f2:120,dur:2.1,a:0.35,g:0.62,rev:0.62});     // deep sub swell
      voice({type:'sine',f:60,f2:240,dur:1.7,a:0.3,g:0.34,rev:0.68,lp:900});
      noise({dur:0.95,ft:'lowpass',ff:600,g:0.5,rev:0.9});                 // gong body
      noise({dur:0.4,ft:'bandpass',ff:170,q:1.2,g:0.34,rev:0.75});         // gong low ring
      [261.63,392,523.25,659.25,783.99,1046.5].forEach((f,i)=>voice({type:'triangle',f:f,t:t+0.14+i*0.03,dur:2.7,a:0.02,g:0.08,rev:0.98}));
      voice({type:'sine',f:880,f2:1760,t:t+0.05,dur:1.2,a:0.01,g:0.14,rev:0.78});
    }
    else if(kind==='tick') voice({type:'triangle',f:680,dur:0.06,a:0.004,g:0.10,rev:0.15});
    else if(kind==='tease'){ voice({type:'sine',f:1046,dur:0.14,g:0.15,rev:0.4}); voice({type:'sine',f:1568,dur:0.14,g:0.08,rev:0.4}); }
    else if(kind==='reveal_N'){ voice({type:'sine',f:200,dur:0.18,g:0.15,rev:0.25}); voice({type:'sine',f:100,dur:0.16,g:0.1}); }
    else if(kind==='reveal_R'){ [330,440].forEach(f=>voice({type:'triangle',f:f,dur:0.24,g:0.11,rev:0.35})); voice({type:'sine',f:165,dur:0.3,g:0.12,rev:0.3,lp:500}); }
    else if(kind==='reveal_SR'){ [440,554,659].forEach((f,i)=>voice({type:'triangle',f:f,t:t+i*0.02,dur:0.42,g:0.11,rev:0.5})); voice({type:'sine',f:110,f2:220,dur:0.5,g:0.28,rev:0.4,lp:600}); noise({dur:0.4,ft:'highpass',ff:3000,g:0.07,rev:0.5}); }
    else if(kind==='deflate'){                              // 맥 빠지는 하강음 (SR fake-out)
      voice({type:'sawtooth',f:440,f2:70,dur:1.0,a:0.02,g:0.2,rev:0.4,lp:1100});
      voice({type:'sine',f:220,f2:55,dur:1.0,a:0.02,g:0.16,rev:0.35});
      voice({type:'triangle',f:330,f2:90,dur:0.85,a:0.02,g:0.09,rev:0.3});
      noise({dur:0.5,ft:'lowpass',ff:420,g:0.1,rev:0.3});
    }
    else if(kind==='ssr_rise'){                             // bigger tension build
      voice({type:'sawtooth',f:110,f2:990,dur:1.15,a:0.06,g:0.16,rev:0.7,lp:1500});
      voice({type:'sine',f:44,f2:110,dur:1.15,a:0.1,g:0.36,rev:0.5});
      voice({type:'triangle',f:220,f2:880,dur:1.15,a:0.08,g:0.08,rev:0.6});
    }
    else if(kind==='ssr'){                                  // full payoff: huge sub + bright chord + crash
      voice({type:'sine',f:44,f2:174,dur:1.5,g:0.62,rev:0.68,lp:520});
      voice({type:'sine',f:88,f2:174,dur:1.2,g:0.3,rev:0.6,lp:700});
      [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,i)=>voice({type:'triangle',f:f,t:t+i*0.05,dur:1.8,g:0.14,rev:0.92}));
      voice({type:'sine',f:1568,t:t+0.42,dur:1.0,g:0.1,rev:0.7});
      noise({dur:0.8,ft:'highpass',ff:2200,g:0.2,rev:0.72});               // crash
      noise({dur:0.5,ft:'lowpass',ff:500,g:0.3,rev:0.7});                  // low boom body
    }
  }
  // one button controls everything (SFX + BGM together)
  const muteBtn=$('#muteBtn');
  function applySound(){
    if(muted){ bgmStop(); if(muteBtn){ muteBtn.textContent='\uD83D\uDD07'; muteBtn.classList.remove('on'); } }
    else { resumeAudio(); bgmStart(); if(muteBtn){ muteBtn.textContent='\uD83D\uDD0A'; muteBtn.classList.add('on'); } }
  }
  if(muteBtn) muteBtn.addEventListener('click',()=>{ muted=!muted; applySound(); });
  // BGM plays from the first interaction (browsers block autoplay before a gesture)
  addEventListener('pointerdown',function kick(){ resumeAudio(); if(!muted) applySound(); }, {once:true});

  // ---- BGM: dreamy summon synth loop (Am\u2013F\u2013C\u2013G) ----
  let bgmOn=false, bgmGain=null, bgmTimer=null, bgmStep=0, bgmNext=0;
  const BGM_BPM=80;
  const BGM_CH=[
    {bass:110.00, arp:[220.00,261.63,329.63,440.00]},  // Am
    {bass:87.31,  arp:[174.61,220.00,261.63,349.23]},  // F
    {bass:130.81, arp:[261.63,329.63,392.00,523.25]},  // C
    {bass:98.00,  arp:[196.00,246.94,293.66,392.00]}   // G
  ];
  function bgmVoice(o){
    const c=actx, t=o.t;
    const osc=c.createOscillator(); osc.type=o.type; osc.frequency.value=o.f; if(o.det)osc.detune.value=o.det;
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(o.g,t+(o.a||0.02));
    g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
    osc.connect(g); g.connect(bgmGain);
    osc.start(t); osc.stop(t+o.dur+0.05);
  }
  function bgmSchedule(step,t,spb){
    if(muted) return;
    const bar=Math.floor(step/16)%4, s=step%16, ch=BGM_CH[bar];
    const an=ch.arp[s%4]*(s>=8?2:1);
    bgmVoice({type:'triangle',f:an,t:t,dur:spb*1.8,g:0.05,a:0.01});                    // arpeggio
    if(s%4===0) bgmVoice({type:'sine',f:ch.bass,t:t,dur:spb*3.5,g:0.14,a:0.01});        // bass pulse
    if(s===0){ [ch.arp[0],ch.arp[1],ch.arp[2]].forEach(f=>{                              // detuned pad
      bgmVoice({type:'sawtooth',f:f,t:t,dur:spb*15,g:0.016,a:0.8,det:7});
      bgmVoice({type:'sawtooth',f:f,t:t,dur:spb*15,g:0.016,a:0.8,det:-7}); }); }
    if(s===6||s===12) bgmVoice({type:'sine',f:ch.arp[3]*2,t:t,dur:spb*2,g:0.02,a:0.02}); // shimmer
  }
  function bgmLoop(){
    if(!bgmOn) return;
    const c=actx, spb=60/BGM_BPM/4;
    while(bgmNext < c.currentTime+0.2){ bgmSchedule(bgmStep,bgmNext,spb); bgmNext+=spb; bgmStep++; }
    bgmTimer=setTimeout(bgmLoop,30);
  }
  function bgmStart(){
    const c=ac(); if(!c) return false; resumeAudio();
    if(bgmOn) return true;
    bgmOn=true;
    bgmGain=c.createGain(); bgmGain.gain.value=0.0001; bgmGain.connect(master);
    bgmGain.gain.exponentialRampToValueAtTime(0.34, c.currentTime+1.2);
    const send=c.createGain(); send.gain.value=0.45; bgmGain.connect(send); send.connect(revConv);
    bgmStep=0; bgmNext=c.currentTime+0.12; bgmLoop();
    return true;
  }
  function bgmStop(){
    if(!bgmOn) return; bgmOn=false;
    clearTimeout(bgmTimer); bgmTimer=null;
    if(bgmGain){ const g=bgmGain, c=actx, now=c.currentTime;
      g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(Math.max(0.0001,g.gain.value),now);
      g.gain.exponentialRampToValueAtTime(0.0001,now+0.6);
      setTimeout(()=>{try{g.disconnect();}catch(e){}},900); bgmGain=null; }
  }

  // ---- per-card charge: slow build with rising "둥…둥…둥↑" hits + near-miss ----
  function chargeAndReveal(slot,person,done){
    if(reduce()){ done(); return; }
    const g=person.grade, deep=(g==='SSR'||g==='SR');
    slot.classList.add('charging');
    const aura=document.createElement('div'); aura.className='charge-aura'; slot.appendChild(aura);
    const set=c=>aura.style.setProperty('--ca',c);
    set('#8FE9FF');
    // more steps + longer gaps for higher rarity → SR/SSR really take their time
    const stepCount = g==='SSR'?5 : g==='SR'?4 : 2;
    const stepMs    = g==='SSR'?280 : g==='SR'?245 : 190;
    const cols=['#8FE9FF','#5FC6FF','#B15CFF','#E39BFF','#FFD23C'];
    const teaseAt = deep ? stepCount-1 : (g==='R' ? (Math.random()<0.45?1:-1) : (Math.random()<0.10?1:-1));
    let acc=0;
    for(let i=0;i<stepCount;i++){
      const idx=i; acc+=stepMs;
      setTimeout(()=>{
        set(cols[Math.min(idx,cols.length-1)]);
        chargeHit(idx,stepCount,deep);
        if(idx===teaseAt){ set('#FFD23C'); quickFlash('#FFE9A8'); sfx('tease'); }
        if(navigator.vibrate && deep) navigator.vibrate(16);
      }, acc);
    }
    const hold = deep?300:170;
    setTimeout(()=>{ slot.classList.remove('charging'); aura.remove(); done(); }, acc+hold);
  }

  if(!loadFromHash()) refreshSetup();
})();
</script>
