<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>소환 · 가챠 추첨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#0A0910; --ink2:#12101E; --panel:#191527; --panel-line:#2A2440;
    --text:#EDE9F7; --text-dim:#9E97BC; --accent:#FF3E7F; --accent-dark:#C71E5A;
    --n:#7C8698; --r:#2FD0E8; --sr:#B15CFF; --ssr:#FFC93C; --charge:#8FE9FF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Pretendard',system-ui,sans-serif;
    background:
      radial-gradient(120% 80% at 50% -10%, #241B3E 0%, rgba(36,27,62,0) 55%),
      radial-gradient(90% 60% at 50% 110%, #2A1030 0%, rgba(42,16,48,0) 60%),
      var(--ink);
    color:var(--text); min-height:100dvh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Black Han Sans',sans-serif;font-weight:400;letter-spacing:.5px;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}

  .ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .ambient::before{
    content:"";position:absolute;top:38%;left:50%;width:140vmax;height:140vmax;transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg, transparent 0deg, rgba(177,92,255,.10) 60deg, transparent 120deg, rgba(47,208,232,.08) 200deg, transparent 260deg, rgba(255,62,127,.10) 320deg, transparent 360deg);
    animation:spin 40s linear infinite;opacity:.7;}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}

  .screen{position:relative;z-index:1;flex:1;display:none;flex-direction:column;padding:22px 20px 28px;}
  .screen.on{display:flex;animation:screenIn .35s ease both;}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .brand{text-align:center;margin-bottom:8px;}
  .brand .kicker{font-size:11px;letter-spacing:6px;color:var(--accent);font-weight:800;margin-bottom:8px;text-shadow:0 0 16px rgba(255,62,127,.5);}
  .brand h1{margin:0;font-family:'Pretendard',sans-serif;font-weight:900;font-size:54px;line-height:1.06;letter-spacing:-1.5px;
    background:linear-gradient(176deg,#FFFFFF 10%,#FFE9A6 42%,#FFB13C 66%,#FF7BB0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 #5A2A82) drop-shadow(0 -1px 0 rgba(255,255,255,.35)) drop-shadow(0 6px 14px rgba(120,40,120,.5)) drop-shadow(0 0 30px rgba(255,120,180,.55));}
  .brand .sub{color:var(--text-dim);font-size:12.5px;margin-top:8px;letter-spacing:.3px;}

  .card-panel{background:linear-gradient(180deg,var(--panel) 0%,#141122 100%);border:1px solid var(--panel-line);
    border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 18px 50px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03);}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  label.flabel{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:8px;letter-spacing:.3px;}
  label.flabel .hint{font-weight:500;font-size:11px;color:#6E6690;}
  textarea{width:100%;min-height:170px;resize:vertical;background:#0E0B18;border:1px solid var(--panel-line);
    border-radius:12px;color:var(--text);padding:13px 14px;font-family:'Pretendard';font-size:15px;line-height:1.7;outline:none;transition:border-color .2s;}
  textarea:focus{border-color:var(--accent);}
  textarea::placeholder{color:#514B6E;}

  .count-pill{display:inline-flex;align-items:center;gap:6px;background:#0E0B18;border:1px solid var(--panel-line);
    border-radius:999px;padding:4px 12px;font-size:12px;color:var(--text-dim);font-weight:600;}
  .count-pill b{color:var(--text);font-size:13px;}

  .stepper{display:flex;align-items:center;background:#0E0B18;border:1px solid var(--panel-line);border-radius:12px;overflow:hidden;width:100%;}
  .stepper button{flex:0 0 54px;height:56px;background:transparent;border:none;color:var(--text);font-size:26px;font-weight:700;cursor:pointer;transition:background .15s;}
  .stepper button:active{background:rgba(255,62,127,.18);}
  .stepper input{flex:1;width:100%;min-width:0;height:56px;line-height:56px;padding:0;border:none;background:transparent;color:var(--ssr);text-align:center;font-family:'Black Han Sans';font-size:24px;outline:none;-moz-appearance:textfield;appearance:textfield;}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .odds-note{margin-top:8px;font-size:11.5px;color:#6E6690;text-align:center;}
  .odds-note b{color:var(--ssr);}
  .warn{color:#FF7A9C;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;font-weight:600;}

  .btn{width:100%;border:none;border-radius:14px;padding:17px;font-family:'Pretendard',sans-serif;font-weight:800;font-size:18px;letter-spacing:.5px;
    cursor:pointer;color:#fff;position:relative;overflow:hidden;transition:transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:linear-gradient(135deg,#FF5E93,var(--accent-dark));box-shadow:0 12px 30px -10px rgba(255,62,127,.6);}
  .btn.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite;}
  @keyframes sheen{0%,100%{left:-60%;}55%,80%{left:130%;}}
  .btn.ghost{background:#191527;border:1px solid var(--panel-line);color:var(--text-dim);box-shadow:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.primary:disabled::after{display:none;}
  .setup-cta{margin-top:20px;}

  /* ---------- draw ---------- */
  .draw-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .back-btn{background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;font-weight:600;padding:6px 2px;}
  .progress{text-align:right;}
  .progress .big{font-family:'Black Han Sans';font-size:22px;line-height:1;}
  .progress .big .rem{color:var(--ssr);}
  .progress .lab{font-size:11px;color:var(--text-dim);letter-spacing:.5px;margin-top:2px;}

  .board-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:2px 4px 8px;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .slot{aspect-ratio:5/7;perspective:800px;cursor:pointer;}
  .slot.done{cursor:default;}
  .slot-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,1.3,.5,1);}
  .slot.flipped .slot-inner{transform:rotateY(180deg);}
  .sface{position:absolute;inset:0;backface-visibility:hidden;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
  .sback{background:linear-gradient(160deg,#241C40,#150F26);border:1px solid #352B55;transition:transform .12s, box-shadow .2s;}
  .sback::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 7px, transparent 7px 14px);}
  .sback .q{font-family:'Black Han Sans';font-size:30px;color:rgba(255,255,255,.14);}
  .slot:not(.done):active .sback{transform:scale(.94);}
  @media(hover:hover){.slot:not(.done):hover .sback{box-shadow:0 0 0 1.5px var(--accent), 0 0 22px -4px var(--accent);}}
  .sfront{transform:rotateY(180deg);border:1.5px solid var(--rc,#7C8698);
    background:radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--rc,#7C8698) 46%, #120E20), #0E0B18 80%);
    box-shadow:0 0 20px -5px var(--rc), inset 0 0 16px -6px var(--rc);}
  .sfront .srank{font-family:'Black Han Sans';font-size:26px;line-height:.9;color:var(--rc);text-shadow:0 0 12px var(--rc);}
  .sfront .sname{font-size:11px;font-weight:800;margin-top:5px;padding:0 4px;text-align:center;word-break:keep-all;line-height:1.2;max-width:100%;}
  .sfront .sstar{position:absolute;top:6px;font-size:8px;letter-spacing:1px;color:var(--rc);opacity:.9;}
  .slot.reveal-pop .slot-inner{animation:pop .4s ease;}
  @keyframes pop{0%{}40%{transform:rotateY(180deg) scale(1.12);}100%{transform:rotateY(180deg) scale(1);}}
  .slot.ssrcard .sfront{animation:ssrGlow 1.5s ease-in-out infinite;}
  @keyframes ssrGlow{0%,100%{box-shadow:0 0 20px -3px var(--ssr), inset 0 0 16px -5px var(--ssr);}50%{box-shadow:0 0 40px 3px var(--ssr), inset 0 0 24px -2px var(--ssr);}}

  .draw-actions{display:flex;gap:10px;margin-top:14px;}
  .draw-actions .btn{margin:0;flex:1;font-size:16px;padding:15px 10px;}

  /* ---------- result ---------- */
  .result-hero{text-align:center;margin-bottom:6px;}
  .result-hero .kicker{color:var(--ssr);font-size:12px;letter-spacing:4px;font-weight:700;}
  .result-hero h2{font-family:'Black Han Sans';font-size:32px;margin:6px 0 2px;letter-spacing:1px;}
  .winners{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .winner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;
    background:radial-gradient(120% 140% at 0% 0%, rgba(255,201,60,.16), rgba(255,201,60,0) 60%), #171226;
    border:1px solid rgba(255,201,60,.4);box-shadow:0 0 30px -12px var(--ssr);}
  .winner .wr{font-family:'Black Han Sans';font-size:26px;color:var(--ssr);text-shadow:0 0 14px var(--ssr);min-width:52px;}
  .winner .wn{font-size:18px;font-weight:800;}
  .winner .wi{margin-left:auto;font-size:11px;color:var(--text-dim);letter-spacing:2px;}
  .no-winner{text-align:center;color:var(--text-dim);padding:24px 0;font-size:14px;}
  .breakdown{margin-top:22px;}
  .breakdown h3{font-size:12px;color:var(--text-dim);letter-spacing:2px;font-weight:700;margin:0 0 12px;text-align:center;}
  .bd-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bd-row .lab{font-family:'Black Han Sans';width:44px;font-size:16px;color:var(--rc);}
  .bd-row .bar{flex:1;height:12px;border-radius:999px;background:#0E0B18;overflow:hidden;border:1px solid var(--panel-line);}
  .bd-row .bar i{display:block;height:100%;background:var(--rc);box-shadow:0 0 12px var(--rc);border-radius:999px;transition:width .8s cubic-bezier(.2,.9,.3,1);}
  .bd-row .cnt{width:34px;text-align:right;font-size:13px;font-weight:700;color:var(--text);}
  .result-actions{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
  .btn.share{background:linear-gradient(135deg,#FFD35A,#FF8A3D);color:#3A2308;box-shadow:0 12px 30px -10px rgba(255,180,60,.6);}
  .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:70;
    background:#241C3C;border:1px solid var(--panel-line);color:var(--text);padding:12px 22px;border-radius:999px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 12px 34px -8px rgba(0,0,0,.75);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  details.roster{margin-top:18px;border-top:1px solid var(--panel-line);padding-top:14px;}
  details.roster summary{cursor:pointer;color:var(--text-dim);font-size:13px;font-weight:600;list-style:none;text-align:center;}
  details.roster summary::-webkit-details-marker{display:none;}
  .roster-list{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--rc);color:var(--rc);background:color-mix(in srgb,var(--rc) 10%, transparent);font-weight:600;}

  /* ---------- fx ---------- */
  .flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;}
  .flash.go{animation:flashGo .5s ease-out;}
  @keyframes flashGo{0%{opacity:0;}18%{opacity:.9;}100%{opacity:0;}}
  #fxCanvas{position:fixed;inset:0;z-index:60;pointer-events:none;}
  .rays{position:fixed;top:50%;left:50%;width:0;height:0;z-index:45;pointer-events:none;opacity:0;}
  .rays.go{animation:raysGo 1.1s ease-out;}
  @keyframes raysGo{0%{opacity:0;}20%{opacity:.8;}100%{opacity:0;}}
  .rays::before{content:"";position:absolute;top:-70vmax;left:-70vmax;width:140vmax;height:140vmax;
    background:conic-gradient(from 0deg, transparent 0 8deg, rgba(255,201,60,.5) 8deg 10deg, transparent 10deg 22deg,
      rgba(255,201,60,.35) 22deg 24deg, transparent 24deg 40deg, rgba(255,201,60,.5) 40deg 42deg, transparent 42deg 60deg);animation:spin 6s linear infinite;}
  .banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);z-index:55;pointer-events:none;
    font-family:'Black Han Sans';font-size:15vw;letter-spacing:4px;opacity:0;
    background:linear-gradient(180deg,#FFF7DA,#FFC93C 60%,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(255,201,60,.6);}
  .banner.go{animation:bannerGo 1.3s cubic-bezier(.2,1.4,.4,1);}
  @keyframes bannerGo{0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}75%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
  .shake{animation:shake .5s ease;}
  @keyframes shake{0%,100%{transform:none;}20%{transform:translate(-5px,3px);}40%{transform:translate(4px,-4px);}60%{transform:translate(-4px,-3px);}80%{transform:translate(4px,3px);}}

  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;}.ambient,.btn.primary::after{display:none;}}
  @media (max-width:400px){.board{grid-template-columns:repeat(3,1fr);} .brand h1{font-size:32px;}}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="app">

  <!-- SETUP -->
  <section class="screen on" id="setup">
    <div class="brand">
      <div class="kicker">GACHA DRAW</div>
      <h1 class="display">당첨 가챠</h1>
      <div class="sub">카드를 뒤집어 SSR을 찾아라 · SSR = 당첨</div>
    </div>
    <div class="card-panel">
      <div class="field">
        <label class="flabel" for="names">참가자 <span class="hint">띄어쓰기 · 쉼표 · 줄바꿈으로 구분</span></label>
        <textarea id="names" placeholder="김민준, 신지환, 김동찬&#10;또는  김민준 신지환 김동찬"></textarea>
        <div style="margin-top:10px;"><span class="count-pill">참가 인원 <b id="pcount">0</b> 명</span></div>
      </div>
      <div class="field">
        <label class="flabel">SSR 당첨 인원</label>
        <div class="stepper">
          <button type="button" id="minus">−</button>
          <input id="ssr" type="number" value="1" min="1" inputmode="numeric">
          <button type="button" id="plus">+</button>
        </div>
        <div class="odds-note">참가자 중 <b id="oddsNum">1</b>명이 <b>SSR</b>로 당첨됩니다</div>
      </div>
      <div class="warn" id="warn"></div>
    </div>
    <button class="btn primary setup-cta" id="startBtn">가챠 뽑기</button>
  </section>

  <!-- DRAW -->
  <section class="screen" id="draw">
    <div class="draw-top">
      <button class="back-btn" id="backBtn">← 다시 설정</button>
      <div class="progress">
        <div class="big"><span class="rem" id="remain">0</span> 장 남음</div>
        <div class="lab">카드를 눌러 뒤집기</div>
      </div>
    </div>
    <div class="board-scroll"><div class="board" id="board"></div></div>
    <div class="draw-actions">
      <button class="btn primary" id="revealAll">전부 공개</button>
      <button class="btn ghost" id="toResult" style="display:none">결과 보기</button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="result">
    <div class="result-hero">
      <div class="kicker">RESULT</div>
      <h2 class="display" id="resultTitle">당첨 결과</h2>
    </div>
    <div class="winners" id="winners"></div>
    <div class="breakdown">
      <h3>등급 분포</h3>
      <div id="bdRows"></div>
    </div>
    <details class="roster">
      <summary>전체 명단 펼쳐보기</summary>
      <div class="roster-list" id="rosterList"></div>
    </details>
    <div class="result-actions">
      <button class="btn share" id="shareBtn">결과 공유</button>
      <button class="btn primary" id="againBtn">같은 명단으로 다시</button>
      <button class="btn ghost" id="newBtn">처음부터</button>
    </div>
  </section>
</div>

<div class="flash" id="flash"></div>
<div class="rays" id="rays"></div>
<div class="banner display" id="banner">SSR</div>
<canvas id="fxCanvas"></canvas>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const RARITY = {
    N:  {color:'#7C8698', stars:'★',     tag:'Normal'},
    R:  {color:'#2FD0E8', stars:'★★',    tag:'Rare'},
    SR: {color:'#B15CFF', stars:'★★★',   tag:'Super Rare'},
    SSR:{color:'#FFC93C', stars:'★★★★★', tag:'당첨'}
  };
  const ORDER = ['SSR','SR','R','N'];

  let state = { people:[], pool:[], slots:0, revealed:0, ssrCount:1, busy:false };

  // ---- setup ----
  const namesEl=$('#names'), ssrEl=$('#ssr'), pcountEl=$('#pcount'), oddsNumEl=$('#oddsNum'), warnEl=$('#warn');
  const parseNames=()=>namesEl.value.split(/[\s,]+/).map(s=>s.trim()).filter(Boolean);
  function refreshSetup(){
    const n=parseNames().length; pcountEl.textContent=n;
    let v=parseInt(ssrEl.value)||1; if(v<1)v=1; if(n>0&&v>n)v=n; ssrEl.value=v; oddsNumEl.textContent=v;
    if(n===0) warnEl.textContent='';
    else if(v>=n) warnEl.textContent='당첨 인원이 참가 인원 이상이에요 — 전부 당첨돼요.';
    else warnEl.textContent='';
  }
  namesEl.addEventListener('input',refreshSetup);
  ssrEl.addEventListener('input',refreshSetup);
  $('#minus').addEventListener('click',()=>{ssrEl.value=Math.max(1,(parseInt(ssrEl.value)||1)-1);refreshSetup();});
  $('#plus').addEventListener('click',()=>{ssrEl.value=(parseInt(ssrEl.value)||1)+1;refreshSetup();});

  $('#startBtn').addEventListener('click',()=>{
    const names=parseNames();
    if(names.length<1){warnEl.textContent='참가자를 한 명 이상 넣어주세요.';namesEl.focus();return;}
    const ssr=Math.min(parseInt(ssrEl.value)||1,names.length);
    buildPool(names,ssr); goDraw();
  });

  function buildPool(names,ssrCount){
    const idx=names.map((_,i)=>i); shuffle(idx);
    const ssrIdx=idx.slice(0,ssrCount);
    const loserIdx=idx.slice(ssrCount);
    // distribute N/R/SR as evenly as possible among non-SSR people
    const grades=['N','R','SR']; const loserGrades=[];
    for(let i=0;i<loserIdx.length;i++) loserGrades.push(grades[i%3]);
    shuffle(loserGrades);
    const gradeOf={};
    ssrIdx.forEach(i=>gradeOf[i]='SSR');
    loserIdx.forEach((i,k)=>gradeOf[i]=loserGrades[k]);
    const people=names.map((name,i)=>({name,grade:gradeOf[i]}));
    const pool=people.slice(); shuffle(pool);      // draw order (random assignment on click)
    state={people,pool,slots:people.length,revealed:0,ssrCount,busy:false};
  }
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

  // ---- screen switching ----
  function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('#'+id).classList.add('on');window.scrollTo(0,0);}
  $('#backBtn').addEventListener('click',()=>{if(!state.busy)show('setup');});

  // ---- draw ----
  const board=$('#board'), remainEl=$('#remain'), revealAllBtn=$('#revealAll'), toResultBtn=$('#toResult');
  function goDraw(){
    board.innerHTML='';
    for(let i=0;i<state.slots;i++){
      const slot=document.createElement('div');
      slot.className='slot';
      slot.innerHTML=`<div class="slot-inner">
        <div class="sface sback"><div class="q">?</div></div>
        <div class="sface sfront"></div>
      </div>`;
      slot.addEventListener('click',()=>onSlotClick(slot));
      board.appendChild(slot);
    }
    remainEl.textContent=state.slots;
    revealAllBtn.style.display=''; revealAllBtn.disabled=false;
    toResultBtn.style.display='none';
    show('draw');
  }

  function onSlotClick(slot){
    if(state.busy || slot.classList.contains('done') || state.pool.length===0) return;
    const person=state.pool.pop();
    flipSlot(slot,person,true);
    state.revealed++; remainEl.textContent=state.slots-state.revealed;
    if(person.grade==='SSR') celebrate();
    else if(person.grade==='SR') burst(RARITY.SR.color,24);
    checkDone();
  }

  function flipSlot(slot,person,pop){
    const rar=RARITY[person.grade];
    slot.classList.add('done');
    slot.style.setProperty('--rc',rar.color);
    const front=slot.querySelector('.sfront');
    front.innerHTML=`<div class="sstar">${rar.stars}</div><div class="srank">${person.grade}</div><div class="sname">${esc(person.name)}</div>`;
    slot.classList.add('flipped');
    if(pop){slot.classList.add('reveal-pop');setTimeout(()=>slot.classList.remove('reveal-pop'),400);}
    if(person.grade==='SSR') slot.classList.add('ssrcard');
  }

  function checkDone(){
    if(state.pool.length===0){
      revealAllBtn.style.display='none';
      toResultBtn.style.display='';
    }
  }

  // reveal all — wave, with SSR emphasis
  revealAllBtn.addEventListener('click',()=>{
    if(state.busy || state.pool.length===0) return;
    state.busy=true; revealAllBtn.disabled=true;
    const slots=[...board.querySelectorAll('.slot:not(.done)')];
    let anySSR=false, delay=0;
    slots.forEach((slot,i)=>{
      const person=state.pool.pop();
      if(person.grade==='SSR') anySSR=true;
      setTimeout(()=>{
        flipSlot(slot,person,false);
        state.revealed++; remainEl.textContent=state.slots-state.revealed;
        if(person.grade==='SSR'){ burst(RARITY.SSR.color,40,true); quickFlash(RARITY.SSR.color); }
      }, delay);
      delay += 90;                         // wave stagger
    });
    setTimeout(()=>{
      if(anySSR) celebrate();
      state.busy=false; checkDone();
    }, delay+300);
  });

  toResultBtn.addEventListener('click',showResult);

  // ---- result ----
  function showResult(){
    const winners=state.people.filter(p=>p.grade==='SSR');
    const wEl=$('#winners');
    if(winners.length){
      $('#resultTitle').textContent='당첨 '+winners.length+'명';
      wEl.innerHTML=winners.map((w,i)=>`<div class="winner"><div class="wr">SSR</div><div class="wn">${esc(w.name)}</div><div class="wi">WINNER ${String(i+1).padStart(2,'0')}</div></div>`).join('');
    }else{
      $('#resultTitle').textContent='당첨자 없음';
      wEl.innerHTML='<div class="no-winner">SSR 당첨자가 없습니다.</div>';
    }
    const counts={SSR:0,SR:0,R:0,N:0}; state.people.forEach(p=>counts[p.grade]++);
    const total=state.people.length;
    $('#bdRows').innerHTML=ORDER.map(g=>`<div class="bd-row" style="--rc:${RARITY[g].color}"><div class="lab">${g}</div><div class="bar"><i style="width:0%"></i></div><div class="cnt">${counts[g]}</div></div>`).join('');
    requestAnimationFrame(()=>{$('#bdRows').querySelectorAll('.bd-row').forEach((row,i)=>{const g=ORDER[i];row.querySelector('i').style.width=(total?counts[g]/total*100:0)+'%';});});
    $('#rosterList').innerHTML=state.people.slice().sort((a,b)=>ORDER.indexOf(a.grade)-ORDER.indexOf(b.grade))
      .map(p=>`<span class="chip" style="--rc:${RARITY[p.grade].color}">${esc(p.name)} · ${p.grade}</span>`).join('');
    show('result');
    if(winners.length) setTimeout(()=>burst(RARITY.SSR.color,70,true),250);
  }
  // ---- share ----
  function buildShareText(){
    const winners=state.people.filter(p=>p.grade==='SSR');
    const counts={SSR:0,SR:0,R:0,N:0}; state.people.forEach(p=>counts[p.grade]++);
    let t='\uD83C\uDF89 \uB2F9\uCCA8 \uAC00\uCC60 \uACB0\uACFC\n\n';
    t += winners.length ? ('\uD83C\uDFC6 \uB2F9\uCCA8(SSR): '+winners.map(w=>w.name).join(', ')+'\n') : '\uD83C\uDFC6 \uB2F9\uCCA8\uC790 \uC5C6\uC74C\n';
    t += '\n\uB4F1\uAE09 \uBD84\uD3EC  SSR '+counts.SSR+' \u00B7 SR '+counts.SR+' \u00B7 R '+counts.R+' \u00B7 N '+counts.N;
    return t;
  }
  let toastTimer=null;
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900);}
  async function shareResult(){
    const text=buildShareText();
    if(navigator.share){
      try{ await navigator.share({title:'\uB2F9\uCCA8 \uAC00\uCC60 \uACB0\uACFC', text}); return; }
      catch(e){ if(e && e.name==='AbortError') return; }
    }
    try{ await navigator.clipboard.writeText(text); toast('\uACB0\uACFC\uB97C \uBCF5\uC0AC\uD588\uC5B4\uC694'); return; }catch(e){}
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); toast('\uACB0\uACFC\uB97C \uBCF5\uC0AC\uD588\uC5B4\uC694'); }catch(e){ toast('\uBCF5\uC0AC\uC5D0 \uC2E4\uD328\uD588\uC5B4\uC694'); }
    ta.remove();
  }
  $('#shareBtn').addEventListener('click',shareResult);
  $('#againBtn').addEventListener('click',()=>{buildPool(state.people.map(p=>p.name),state.ssrCount);goDraw();});
  $('#newBtn').addEventListener('click',()=>{show('setup');refreshSetup();});

  const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---- fx ----
  const flashEl=$('#flash'), raysEl=$('#rays'), bannerEl=$('#banner');
  function quickFlash(color){flashEl.style.background=`radial-gradient(circle at 50% 45%, ${color}, transparent 60%)`;flashEl.classList.remove('go');void flashEl.offsetWidth;flashEl.classList.add('go');}
  function celebrate(){
    raysEl.classList.remove('go');void raysEl.offsetWidth;raysEl.classList.add('go');
    bannerEl.classList.remove('go');void bannerEl.offsetWidth;bannerEl.classList.add('go');
    $('.app').classList.remove('shake');void $('.app').offsetWidth;$('.app').classList.add('shake');
    quickFlash(RARITY.SSR.color); burst(RARITY.SSR.color,90,true);
    if(navigator.vibrate) navigator.vibrate([40,30,90]);
  }
  const canvas=$('#fxCanvas'), ctx=canvas.getContext('2d');
  let parts=[], raf=null;
  function sizeCanvas(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  sizeCanvas(); addEventListener('resize',sizeCanvas);
  const palette=['#FFC93C','#FFE9A8','#FF3E7F','#2FD0E8','#B15CFF','#FFFFFF'];
  function burst(color,count,rainbow){
    const cx=innerWidth/2, cy=innerHeight*0.4;
    for(let i=0;i<count;i++){
      const ang=Math.random()*Math.PI*2, sp=4+Math.random()*11;
      parts.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-4,g:0.28+Math.random()*0.12,life:1,decay:0.008+Math.random()*0.012,size:4+Math.random()*6,rot:Math.random()*6.28,vr:(Math.random()-.5)*0.4,color:rainbow?palette[(Math.random()*palette.length)|0]:color});
    }
    if(!raf) raf=requestAnimationFrame(loop);
  }
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts=parts.filter(p=>p.life>0);
    for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.rot+=p.vr;p.life-=p.decay;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);ctx.restore();}
    if(parts.length) raf=requestAnimationFrame(loop); else {raf=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
  }

  refreshSetup();
})();
</script>
</body>
</html>
